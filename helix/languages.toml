[[language]]
name = "maxmsp"
scope = "source.maxpat"
file-types = [
    "maxdefaults",
    "maxdefines",
    "maxhelp",
    "maxpat",
    "maxpref",
    "maxpresets",
    "maxproto",
    "maxquery",
    "maxswatches",
    "maxtheme",
    "maxsnip",
    "maxsnap",
    "maxstx",
]
grammar = "json"

[[language]]
name = "slip"
scope = "source.slip"
file-types = ["slip"]
grammar = "scheme"
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "html"
scope = "source.html"
file-types = ["html"]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "scheme"
indent = { tab-width = 4, unit = "    " }
language-servers = [ "steel-language-server" ]

[language-server.steel-language-server]
command = "steel-language-server"
args = []

[[language]]
name = "c"
scope = "source.c"
file-types = ["h", "c", "cpp", "xpm"]
indent = { tab-width = 4, unit = "    " }

[language-server.clangd]
command = "clangd"
args = ["--enable-config"]

[[language]]
name = "rust"
scope = "source.rs"
file-types = ["rs"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "go"
scope = "source.go"
file-types = ["go"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "tmux"
scope = "source.tmux.conf"
file-types = ["tmux.conf", { glob = "*.tmux.conf" } ]
grammar = "bash"
indent = { tab-width = 4, unit = "    " }

# [[language]]
# name = "zsh"
# scope = "source.zsh"
# file-types = ["zsh", "sh", "bash"]
# indent = { tab-width = 4, unit = "    " }

[[language]]
name = "json"
scope = "source.json"
file-types = ["json", "jsonc", "jsonl"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "lua"
scope = "source.lua"
file-types = ["lua"]
indent = { tab-width = 4, unit = "    " }
