theme = "transpo"

[editor]
popup-border = "all"
line-number = "relative"
scroll-lines = 1
auto-format = false
bufferline = "multiple"
color-modes = true
default-yank-register= "+"
clipboard-provider = "pasteboard"
# end-of-line-diagnostics = "hint"

#     [editor.inline-diagnostics]
#     cursor-line = "error"

    [editor.cursor-shape]
    insert = "bar"
    normal = "block"
    select = "underline"

    [editor.file-picker]
    hidden = false

    [editor.smart-tab]
    enable = false

    # change it for machines using terminess cuz its ugly
    # [editor.soft-wrap] 
    # wrap-indicator = ""

    [editor.statusline]
    left = [
        "mode",
        "file-base-name",
        "file-modification-indicator",
    ]
    right = [
        "spinner",
        "diagnostics",
        "read-only-indicator",
        "position",
        "file-type",
        "total-line-numbers",
    ]
    diagnostics = [
        "warning",
        "error",
    ]
    workspace-diagnostics = [
        "warning",
        "error",
    ]
    mode.normal = "NORMAL"
    mode.insert = "INSERT"
    mode.select = "SELECT"

[keys.normal]
X = "extend_line_above" # what it should be by default
H = "goto_previous_buffer"
L = "goto_next_buffer"
C-R = ":reload-all"
Cmd-s = ":write"

    # my own fresh minor mode
    [keys.normal.tab]
    w = ":toggle soft-wrap.enable"
    s = "split_selection_on_newline"
    minus = "merge_selections"
    _ = "merge_consecutive_selections"
    c = "copy_selection_on_prev_line"
    h = "flip_selections"
    H = "ensure_selections_forward"
    space = ":pipe-to ~/.config/helix/repler.sh"
    r = ":config-reload"
    o = ":insert-output ~/.local/scripts/snips/snipper"

[keys.select]

    [keys.select.tab]
    s = "split_selection_on_newline"
    minus = "merge_selections"
    _ = "merge_consecutive_selections"
    c = "copy_selection_on_prev_line"
    h = "flip_selections"
    H = "ensure_selections_forward"
    space = ":pipe-to ~/.config/helix/repler.sh"
    r = ":config-reload"
    o = ":insert-output ~/.local/scripts/snips/snipper"
