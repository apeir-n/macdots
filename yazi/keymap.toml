[[mgr.prepend_keymap]]
on = "R"
run = '''
shell --confirm --block '
    ~/.config/yazi/plugins/reveal_in_finder.sh
'
'''
desc = "reveal_finder"

[[mgr.prepend_keymap]]
on = "<Space>"
run = '''
shell '
    ~/.config/yazi/plugins/hackadoodle_ql.sh "$1"
' -- $1
'''
desc = "quicklook"

[[mgr.prepend_keymap]]
on = "w"
run = '''
shell '
    paperplane "$1"
' -- $1
'''
desc = "wallpaper_set"

[[mgr.prepend_keymap]]
on = "N"
run = '''
shell '
    nsxiv --anti-alias=no "$1"
' -- $1
'''
desc = "nsxiv_open"

[[mgr.prepend_keymap]]
on = "'"
run = '''
shell --block '
    nvim "$1"
' -- $1
'''
desc = "nvim_open"

[[mgr.prepend_keymap]]
on = '"'
run = '''
shell --block '
    vim "$1"
' -- $1
'''
desc = "vim_open"

[[mgr.prepend_keymap]]
on = "\\"
run = '''
shell --block '
    vis-editor "$1"
' -- $1
'''
desc = "vis_open"

[[mgr.prepend_keymap]]
on  = [ "+", "x" ]
run = '''
shell '
    chmod +x "$1"
' -- $1
'''
desc = "chmod+x"

[[mgr.prepend_keymap]]
on  = [ "c", "p" ]
run = "copy dirname"
desc = "copy_path"

[[mgr.prepend_keymap]]
on  = [ "c", "d" ]
run = "plugin zoxide"
desc = "change_dir"

[[mgr.prepend_keymap]]
on  = [ "g", "n" ]
run = "cd ~/.nursery"
desc = "go_nursery"

[[mgr.prepend_keymap]]
on  = [ "g", "b" ]
run = "cd ~/.baby"
desc = "go_baby"

[[mgr.prepend_keymap]]
on  = [ "g", "s" ]
run = "cd ~/.local/scripts"
desc = "go_scripts"

[[mgr.prepend_keymap]]
on  = [ "g", "v" ]
run = 'cd ~/Library/Mobile\ Documents/iCloud~md~obsidian/Documents/Vault'
desc = "go_vault"

[[mgr.prepend_keymap]]
on  = [ "g", "l" ]
run = "cd ~/.local"
desc = "go_local"

[[mgr.prepend_keymap]]
on  = [ "g", "w" ]
run = "cd ~/Pictures/wallpapers"
desc = "go_wallpapers"

[[mgr.prepend_keymap]]
on  = [ "g", "y" ]
run = "cd ~/.cache/wal"
desc = "go_pywal"

[[mgr.prepend_keymap]]
on  = [ "g", "p" ]
run = "cd ~/Projects"
desc = "go_projects"

[[mgr.prepend_keymap]]
on  = [ "g", "c" ]
run = "cd ~/.config"
desc = "go_config"

[[mgr.prepend_keymap]]
on  = [ "g", "d" ]
run = "cd ~/Downloads"
desc = "go_downloads"

[[mgr.prepend_keymap]]
on  = [ "g", "h" ]
run = "cd ~"
desc = "go_home"

#[[mgr.prepend_keymap]]
#on  = [ "g", "t" ]
#run = "cd ~/Music/tides"
#desc = "go_tidal"

[[mgr.prepend_keymap]]
on  = "H"
run = "tab_switch -1 --relative"
desc = "prevtab"

[[mgr.prepend_keymap]]
on  = "L"
run = "tab_switch 1 --relative"
desc = "nexttab"

[[mgr.prepend_keymap]]
on   = "="
run  = "plugin zoom 1"
desc = "zoom_in"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "zoom_out"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"
